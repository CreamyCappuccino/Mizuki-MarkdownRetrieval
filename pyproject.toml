[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mizuki-markdown-retrieval"
version = "0.1.0"
description = "Markdown retrieval adapter for SearchE and the shared Retrieval Toolkit"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Private" }
authors = [{ name = "Mizuki / CreamyCappuccino" }]
dependencies = [
  "psycopg[binary]>=3.2,<4",
  "pgvector>=0.5,<1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "mcp>=2.1.1,<2.2",
  "PyJWT[crypto]>=2.13,<3",
]
mcp = ["mcp>=2.1.1,<2.2"]
remote = [
  "mcp>=2.1.1,<2.2",
  "PyJWT[crypto]>=2.13,<3",
]

[project.scripts]
mizuki-mdr = "mizuki_markdown_retrieval.cli:main"
mizuki-mdr-mcp = "mizuki_markdown_retrieval.mcp_server:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
